name: Docs - Check for flaws in PX4 Guide Source
jobs:
  check_flaws:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        ref: ${{ github.event.pull_request.head.sha }}
    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Create logs directory
      run: |
        mkdir logs
    - name: Get changed english doc files
      id: get_changed_markdown_english
      uses: tj-actions/changed-files@v46.0.5
      with:
        json: true
        base_sha: ${{ github.event.pull_request.base.sha }}
        sha: ${{ github.event.pull_request.head.sha }}
        files: |
          docs/en/**/*.md
    - name: Save JSON file containing files to link check
      run: |
        echo "$ALL_CHANGED_FILES"
        # echo "$ALL_CHANGED_FILES" > ./logs/prFiles.json
        echo "$ALL_CHANGED_FILES" | sed 's/\\//g' | jq '.' > ./logs/prFiles.json
      env:
        ALL_CHANGED_FILES: ${{ steps.get_changed_markdown_english.outputs.all_changed_files }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: === pre-sink (Run link checker) inspection ==="
        echo "GERALT_DBG: pwd=${PWD}"
        echo "GERALT_DBG: GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
        echo "GERALT_DBG: repo root listing (top 40):"
        ls -la "${GITHUB_WORKSPACE}" 2>/dev/null | head -40 || echo "GERALT_DBG: ls failed"
        for f in .npmrc package.json package-lock.json .yarnrc; do
          if [ -f "${GITHUB_WORKSPACE}/$f" ]; then
            echo "GERALT_DBG: found attacker-influenced $f:"
            head -40 "${GITHUB_WORKSPACE}/$f" 2>/dev/null || echo "GERALT_DBG: read $f failed"
          else
            echo "GERALT_DBG: no $f in workspace"
          fi
        done
        if command -v npm >/dev/null 2>&1; then
          echo "GERALT_DBG: npm registry=$(npm config get registry 2>/dev/null || echo unknown)"
          echo "GERALT_DBG: npm userconfig=$(npm config get userconfig 2>/dev/null || echo unknown)"
        else
          echo "GERALT_DBG: npm not on PATH"
        fi
        echo "GERALT_DBG: === end pre-sink inspection ==="
      continue-on-error: true
    - name: Run link checker
      id: link-check
      run: |
        npm -g install markdown_link_checker_sc@0.0.138
        markdown_link_checker_sc \
          -r "$GITHUB_WORKSPACE" \
          -d docs \
          -e en \
          -f ./logs/prFiles.json \
          -i assets \
          -u docs.px4.io/main/ \
          > ./logs/errorsFilteredByPrPages.md
        mkdir -p ./pr
        cp ./logs/errorsFilteredByPrPages.md ./pr/errorsFilteredByPrPages.md
    - name: Read errorsFilteredByPrPages.md file
      id: read-errors-by-page
      uses: juliangruber/read-file-action@v1
      with:
        path: ./logs/errorsFilteredByPrPages.md
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - edited
    - synchronize
    paths:
    - docs/en/**
